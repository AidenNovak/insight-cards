# insight-cards 落地页 —— 宿主 nginx vhost（模板，由 site/deploy.sh 安装）
#
# 这台主机的规矩（照抄 memoh-dev-public 那套，别自己发明）：
#   443 由宿主 nginx 的 SNI 分流进来（nginx.conf 里 www.samsung.com → Xray REALITY，
#   default → 127.0.0.1:9443），所以站点监听 9443 而不是 443。
#   80 只做 ACME challenge 与跳转；证书由 certbot 的 nginx 认证器签发。
#
# 纯静态：root 指向 /var/www/skill.sg.aidenovak.com 。

server {
    listen 80;
    listen [::]:80;
    server_name skill.sg.aidenovak.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    # nginx 1.24（Ubuntu 24.04）：http2 只能写在 listen 上。
    listen 127.0.0.1:9443 ssl http2;
    listen [::1]:9443 ssl http2;
    server_name skill.sg.aidenovak.com;

    ssl_certificate     /etc/letsencrypt/live/skill.sg.aidenovak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skill.sg.aidenovak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/skill.sg.aidenovak.com;
    index index.html;

    # 静态站：缓存图，但 HTML 每次回源拿新的（改文案不用等缓存过期）。
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

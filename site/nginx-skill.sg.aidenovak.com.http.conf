# insight-cards 落地页 —— 首次签发证书用的 **HTTP-only** vhost。
#
# 为什么要这一份：vhost 里写死 `ssl_certificate /etc/letsencrypt/live/<host>/...`
# 而证书还没签发时，`nginx -t` 直接失败（cannot load certificate），
# certbot 的 nginx 认证器也跟着失败 —— 鸡生蛋的问题。所以顺序是：
#   ① 先用这一份（只监听 80，做 ACME challenge）把证书签出来；
#   ② 再装 nginx-skill.sg.aidenovak.com.conf（带 9443 ssl）并 reload。
# site/deploy.sh 会自动按证书是否存在选这一份还是那一份。
#
# 签完之后这一份就不再被启用了（deploy.sh 会覆盖成完整版）。

server {
    listen 80;
    listen [::]:80;
    server_name skill.sg.aidenovak.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    root /var/www/skill.sg.aidenovak.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
